services:

  # ==========================================
  # USER SERVICE
  # ==========================================

  user-service:
    build:
      context: ./user-service

    container_name: smart-user-service

    ports:
      - "8001:8001"

    networks:
      - smart-ecommerce-network


  # ==========================================
  # PRODUCT SERVICE
  # ==========================================

  product-service:
    build:
      context: ./product-service

    container_name: smart-product-service

    ports:
      - "8002:8002"

    networks:
      - smart-ecommerce-network


  # ==========================================
  # PAYMENT SERVICE
  # ==========================================

  payment-service:
    build:
      context: ./payment-service

    container_name: smart-payment-service

    ports:
      - "8003:8003"

    environment:
      ORDER_SERVICE_URL: http://order-service:8004

    depends_on:
      - order-service

    networks:
      - smart-ecommerce-network


  # ==========================================
  # ORDER SERVICE
  # ==========================================

  order-service:
    build:
      context: ./order-service

    container_name: smart-order-service

    ports:
      - "8004:8004"

    environment:
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002

    depends_on:
      - user-service
      - product-service

    networks:
      - smart-ecommerce-network


  # ==========================================
  # API GATEWAY / NGINX
  # ==========================================

  api-gateway:
    image: nginx:alpine

    container_name: smart-api-gateway

    ports:
      - "8000:8000"

    volumes:
      - ./api-gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service

    networks:
      - smart-ecommerce-network


# ==========================================
# NETWORK
# ==========================================

networks:

  smart-ecommerce-network:
    driver: bridge